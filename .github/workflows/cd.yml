name: CD Backend

on:
  push:
    branches:
      - master
      - develop
  workflow_dispatch:

jobs:
  deploy-via-ssh:
    name: CD Deploy (SSH Ubuntu)
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # ĐÃ XÓA BỎ BƯỚC SETUP .NET SDK DƯ THỪA

      - name: Package source code
        run: tar -czf sc-api-release.tar.gz --exclude='.git' --exclude='**/bin' --exclude='**/obj' .

      - name: Upload package to Ubuntu
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: sc-api-release.tar.gz
          target: /tmp

      - name: Deploy via SSH (simulate supported)
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH_API }}
          DEPLOY_SIMULATE: ${{ secrets.DEPLOY_SIMULATE }}
          BRANCH_NAME: ${{ github.ref_name }} # Lấy tên nhánh (master hoặc develop)
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: DEPLOY_PATH,DEPLOY_SIMULATE,BRANCH_NAME
          script: |
            set -e
            # Tự động tách thư mục theo nhánh: .../api/master hoặc .../api/develop
            BASE_PATH="${DEPLOY_PATH:-/opt/smartcanteen/api}"
            TARGET_PATH="$BASE_PATH/$BRANCH_NAME"
            SIMULATE="${DEPLOY_SIMULATE:-true}"

            mkdir -p "$TARGET_PATH"
            if [ "$SIMULATE" = "true" ]; then
              echo "[SIMULATE] SSH connected to Ubuntu"
              echo "[SIMULATE] Would extract /tmp/sc-api-release.tar.gz to $TARGET_PATH"
              echo "[SIMULATE] Would run docker compose up -d --build api in $TARGET_PATH/Docker"
            else
              tar -xzf /tmp/sc-api-release.tar.gz -C "$TARGET_PATH"
              rm -f /tmp/sc-api-release.tar.gz # Dọn dẹp file tạm
              
              cd "$TARGET_PATH/Docker"
              docker compose up -d --build api
            fi
