version: "3.9"

services:
  postgres:
    image: postgres:17-alpine
    container_name: smartcanteen-postgres
    environment:
      POSTGRES_DB: smartcanteen
      POSTGRES_USER: smartcanteen
      POSTGRES_PASSWORD: smartcanteen
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U smartcanteen -d smartcanteen" ]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: SC.Api/Dockerfile
    container_name: smartcanteen-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=smartcanteen;Username=smartcanteen;Password=smartcanteen;Include Error Detail=true
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  postgres_data:

